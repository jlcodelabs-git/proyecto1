<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diario de Estudio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="hoja">
    <header class="cabecera">
      <h1>Diario de Estudio</h1>
      <button id="toggleTema" class="toggle-tema" type="button">Modo oscuro</button>
    </header>

    <section class="racha" aria-live="polite">
      <div class="sello" id="sello">
        <span class="sello-numero" id="rachaNumero">0</span>
        <span class="sello-texto" id="rachaTexto">días de racha</span>
      </div>
    </section>

    <section class="semana">
      <strong id="semanaMinutos">0</strong>
      <span>minutos esta semana</span>
    </section>

    <form id="formulario" class="formulario">
      <label>
        Fecha
        <input type="date" id="fecha" required />
      </label>
      <label>
        Tema
        <input type="text" id="tema" required placeholder="Ej. Matemáticas" />
      </label>
      <label>
        Minutos
        <input type="number" id="minutos" min="1" required placeholder="30" />
      </label>
      <button type="submit">Añadir sesión</button>
    </form>

    <section>
      <h2>Sesiones</h2>
      <ul id="listaSesiones" class="lista"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
